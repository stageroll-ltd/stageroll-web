<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // `in-app` when the app opened this tab (?from=app): every way to buy is hidden
      // for as long as the tab stays open, across its links (`.sells`, src/styles.css).
      (function (d, app) {
        d.classList.add("js")
        try {
          if (app) sessionStorage.setItem("from", "app")
          if (sessionStorage.getItem("from") === "app") d.classList.add("in-app")
        } catch (e) {
          if (app) d.classList.add("in-app")
        }
      })(document.documentElement, /[?&]from=app(&|$)/.test(location.search))
    </script>
    <title>StageRoll — Continuity and inventory app for film and TV</title>
