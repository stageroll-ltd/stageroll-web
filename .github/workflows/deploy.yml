name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Actions are pinned to commits, not tags: a tag can be moved, a commit
# cannot. Bump the SHA and the comment together.
# One deploy at a time; a queued one still runs so the last push wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # Node 26 no longer ships corepack, so it is installed, pinned.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: yarn install --immutable
      # NO ENV FILE IS IN GIT (owner's rule, 2026-11-15; .gitignore). The
      # three public values the build bakes into the pages are this repo's
      # Actions VARIABLES (Settings › Secrets and variables › Actions ›
      # Variables; `gh variable set NAME --body VALUE`), not secrets:
      # anything VITE_ is readable in the live page. A missing one stops
      # the deploy here, rather than shipping a page with no Supabase
      # origin in its Content-Security-Policy. .env.example says the rest.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # PostHog's public token (src/analytics.ts). Optional: unset, the
          # site sends nothing and the deploy goes ahead.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_TURNSTILE_SITE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The Actions variable $name is not set (see .env.example)"
              exit 1
            fi
          done
          yarn build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Turns Pages on (source: GitHub Actions) the first time this runs.
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # .well-known/apple-app-site-association is a dotfile folder: the
          # app's saved passwords for stageroll.co (webcredentials).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # IndexNow (indexnow.org): tells Bing, and the search engines that
      # share its list, which pages changed, so they are read again within
      # hours and not at the next crawl. Only the pages whose sitemap date
      # (`updated` in src/routes.tsx) is today or yesterday are sent: the
      # protocol asks for changed pages, not the whole site. The key is
      # public by design: it is the file public/<key>.txt, which proves the
      # sender runs the site. A failure here never fails the deploy.
      - name: Tell search engines what changed (IndexNow)
        continue-on-error: true
        env:
          KEY: e0cb587d42c865b7de3fb67a0e38eb16
        run: |
          since=$(date -u -d yesterday +%F)
          urls=$(curl -fsS https://stageroll.co/sitemap.xml \
            | grep -o '<url><loc>[^<]*</loc><lastmod>[^<]*</lastmod>' \
            | sed -E 's#<url><loc>([^<]*)</loc><lastmod>([^<]*)</lastmod>#\2 \1#' \
            | awk -v since="$since" '$1 >= since { print $2 }')
          if [ -z "$urls" ]; then
            echo "No page changed since $since; nothing to send."
            exit 0
          fi
          body=$(printf '%s\n' "$urls" | jq -R . | jq -s --arg key "$KEY" \
            '{host: "stageroll.co", key: $key, keyLocation: ("https://stageroll.co/" + $key + ".txt"), urlList: .}')
          echo "$body"
          curl -fsS -o /dev/null -w 'IndexNow answered %{http_code}\n' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$body"
