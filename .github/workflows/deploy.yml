name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Actions are pinned to commits, not tags: a tag can be moved, a commit
# cannot. Bump the SHA and the comment together.
# One deploy at a time; a queued one still runs so the last push wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # Node 26 no longer ships corepack, so it is installed, pinned.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: yarn install --immutable
      # NO ENV FILE IS IN GIT (owner's rule, 2026-11-15; .gitignore). The
      # three public values the build bakes into the pages are this repo's
      # Actions VARIABLES (Settings › Secrets and variables › Actions ›
      # Variables; `gh variable set NAME --body VALUE`), not secrets:
      # anything VITE_ is readable in the live page. A missing one stops
      # the deploy here, rather than shipping a page with no Supabase
      # origin in its Content-Security-Policy. .env.example says the rest.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_TURNSTILE_SITE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The Actions variable $name is not set (see .env.example)"
              exit 1
            fi
          done
          yarn build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Turns Pages on (source: GitHub Actions) the first time this runs.
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # .well-known/apple-app-site-association is a dotfile folder: the
          # app's saved passwords for stageroll.co (webcredentials).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
