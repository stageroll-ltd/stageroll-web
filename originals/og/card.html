<!-- The share image, public/og/stageroll.png (1200x630). To redraw it: copy public/brand/wordmark-dark.svg beside this file, then
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=stageroll.png "file://$PWD/card.html" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #fff; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* The site's phone (styles.css .phone/.screen), at 540 tall: 0.871 of its 620. */
  .phone { width: 261px; height: 540px; box-sizing: border-box; border-radius: 43.5px; background: #0b101b; padding: 9.6px; box-shadow: inset 0 0 0 1.5px #2a3040; }
  /* The app's launch screen colour (stageroll-native app.json, expo-splash-screen backgroundColor). */
  .screen { position: relative; height: 100%; border-radius: 34.8px; background: #14161b; display: grid; place-items: center; overflow: hidden; }
  .screen::before { content: ''; position: absolute; top: 6px; left: 50%; translate: -50% 0; width: 70px; height: 21px; border-radius: 17px; background: #000; }
  .screen img { width: 150px; height: auto; display: block; }
</style></head><body>
  <div class="phone"><div class="screen"><img src="wordmark-dark.svg" alt=""></div></div>
</body></html>
