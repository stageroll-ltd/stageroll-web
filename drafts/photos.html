const kept = new Set(JSON.parse(localStorage.getItem('sr-keep') || '[]'))
const jump = document.getElementById('jump'), secs = document.getElementById('sections')
CATS.forEach(([name, sub, items], i) => {
  const id = 'c' + i
  jump.insertAdjacentHTML('beforeend', `<a href="#${id}">${name} · ${items.length}</a>`)
  secs.insertAdjacentHTML('beforeend', `<section id="${id}"><h2>${name}</h2><p class="sub">${sub}</p><div class="grid">${items.map(([gid, t, url]) =>
    `<div class="t${kept.has(gid) ? ' kept' : ''}" data-id="${gid}"><img src="${url}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.t').remove()"><div class="c"><b>${t}</b><span>${gid} · <a href="https://www.gettyimages.co.uk/search/2/image?phrase=${gid}" target="_blank" rel="noopener">Getty</a></span></div></div>`).join('')}</div></section>`)
})
jump.insertAdjacentHTML('beforeend', `<a href="#keep" class="k">Keep list</a>`)
document.querySelectorAll('.t').forEach(t => t.addEventListener('click', e => { if (e.target.tagName === 'A') return; const id = t.dataset.id; kept.has(id) ? kept.delete(id) : kept.add(id); t.classList.toggle('kept', kept.has(id)); save() }))
function save() {
  localStorage.setItem('sr-keep', JSON.stringify([...kept]))
  document.getElementById('count').textContent = kept.size ? `${kept.size} kept` : 'nothing kept yet'
  document.getElementById('keeptext').value = [...kept].map(id => { const t = document.querySelector(`.t[data-id="${id}"] b`)?.textContent || ''; return `${id}  ${t}  https://www.gettyimages.co.uk/search/2/image?phrase=${id}` }).join('\n')
}
save()
